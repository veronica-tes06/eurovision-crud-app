<html>
<head>
<title>Eurovision</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<script src="js/jquery.js"></script>
<script src="js/jquery.dataTables.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/main.js"></script>
<link rel="stylesheet" href="css/jquery.dataTables.css"/>
<link rel="stylesheet" href="css/bootstrap.css"/>
<link rel="stylesheet" href="css/my.css"/>
</head>

<body>
    <h1>Welcome to the Eurovision Song Contest Application </h1>
    <!-- Nav tabs -->
    <ul class="nav nav-tabs" role="tablist">
        <li class="active"><a href="#home" role="tab" data-toggle="tab">Home</a></li>
        <li><a href="#products" role="tab" data-toggle="tab">Countries</a></li>
        <li><a href="#manageUsers" role="tab" data-toggle="tab">Manage Users</a></li>

     </ul>
	<!-- Tab panes -->
    <div class="tab-content">
        <div class="tab-pane active" id="home">
            <h1>Countries</h1>
			<div id="countryCardContainer">
                
            </div>

            <h2>Add / Edit Country</h2>
            <!-- Add / Edit Country Form -->
            <form id="countryForm" class="form-horizontal p-3">

                <input type="hidden" id="countryId"> <!-- used only when editing -->

                <div class="form-group">
                    <label class="col-sm-2 control-label">Country Name</label>
                    <div class="col-sm-6">
                        <input type="text" id="countryName" class="form-control"
                            placeholder="e.g. Sweden" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Wins</label>
                    <div class="col-sm-2">
                        <input type="number" id="wins" class="form-control" value="0" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Contests Entered</label>
                    <div class="col-sm-2">
                        <input type="number" id="contests" class="form-control" value="0" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Best Placement</label>
                    <div class="col-sm-3">
                        <input type="text" id="bestPlace" class="form-control"
                            placeholder="e.g. 1st, 2nd, 3rd..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Max Points</label>
                    <div class="col-sm-2">
                        <input type="number" id="maxPoints" class="form-control" value="0" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Automatic Qualification</label>
                    <div class="col-sm-2">
                        <select id="automaticQualification" class="form-control">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">First Year</label>
                    <div class="col-sm-3">
                        <input type="number" id="firstYear" class="form-control"
                            placeholder="e.g. 1958" min="1950" max="2050" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-sm-offset-2 col-sm-6">
                        <button type="submit" class="btn btn-success" id="saveCountryBtn">Add Country</button>
                        <button type="submit" class="btn btn-info" id="updateCountryBtn" style="display:none;">Update Country</button>
                        <button type="button" class="btn btn-default" id="resetCountryForm">Clear</button>
                    </div>
                </div>
            </form>
            <div id="countryFormMessage" class="p-3"></div>
        </div>
        <div class="tab-pane" id="products">
            <table id="table_id" class="display">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Wins</th>
                        <th>Automatic Qualification?</th>
                        <th>Max Points</th>
                        <th>Best Placement</th>
                        <th>More</th>
                    </tr>
                </thead>
                <tbody id="table_body">
                </tbody>
            </table>
        </div>
        <div class="tab-pane" id="manageUsers">
            <h2>Manage Users</h2>

            <!-- Add / Edit User Form -->
            <form id="userForm" class="form-horizontal p-3">

                <input type="hidden" id="userId"> <!-- used only when editing -->

                <div class="form-group">
                    <label class="col-sm-2 control-label">Name</label>
                    <div class="col-sm-6">
                        <input type="text" id="userName" class="form-control"
                            placeholder="e.g. John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Username</label>
                    <div class="col-sm-6">
                        <input type="text" id="username" class="form-control"
                            placeholder="e.g. johndoe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Password</label>
                    <div class="col-sm-6">
                        <input type="password" id="password" class="form-control"
                            placeholder="Enter password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Image URL</label>
                    <div class="col-sm-6">
                        <input type="text" id="image" class="form-control"
                            placeholder="e.g. path/to/image.jpg">
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-sm-offset-2 col-sm-6">
                        <button type="submit" class="btn btn-success" id="saveUserBtn">Add User</button>
                        <button type="submit" class="btn btn-info" id="updateUserBtn" style="display:none;">Update User</button>
                        <button type="button" class="btn btn-default" id="resetUserForm">Clear</button>
                    </div>
                </div>
            </form>
            <div id="userFormMessage" class="p-3"></div>

            <!-- Users Table -->
            <div class="p-3">
                <h3>Users List</h3>
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Image</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                    </tbody>
                </table>
            </div>
        </div>


    </div>

		<!-- definition for Modal -->
		<div class="modal fade" id="myModal" role="dialog">
                <div class="modal-dialog">
    
                <!-- Modal content-->
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal">&times;</button>
                            <h4 class="modal-title">Country Details</h4>
                        </div>
                        <div class="modal-body">
                            <div id="contents"></div>
                            <div class="form-group" style="margin-top: 20px;">
                                <button type="button" class="btn btn-info" id="editCountryModalBtn">Edit</button>
                                <button type="button" class="btn btn-danger" id="deleteCountryModalBtn">Delete</button>
                                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
</body>
</html>
